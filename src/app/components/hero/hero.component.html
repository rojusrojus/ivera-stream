<section id="hero" class="hero">

  <!-- Crossfading video backgrounds -->
  <div class="hero__videos">
    @for (video of videos; track video; let i = $index) {
      <video
        class="hero__video"
        [class.hero__video--active]="i === activeIndex"
        [src]="video"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
      </video>
    }
  </div>

  <!-- Dark gradient overlay -->
  <div class="hero__overlay"></div>

  <!-- Content -->
  <div class="hero__content">
    <span class="section-label">Vancouver, British Columbia</span>
    <h1 class="hero__title">
      Share Every<br>
      <em>Sacred Moment</em><br>
      Live
    </h1>
    <h2 class="hero__subtitle center">Event Streaming Services</h2>
    <!-- <p class="hero__subtitle">
      Professional live streaming for weddings and memorial services across Vancouver and the Lower Mainland.
      Let your loved ones be there — wherever they are in the world.
    </p> -->
    <div class="hero__actions">
      <button class="btn btn--primary" (click)="scrollTo('booking')">Book Your Stream</button>
      <button class="btn btn--outline" (click)="scrollTo('packages')">View Packages</button>
    </div>
    <div class="hero__stats">
      <div class="stat">
        <span class="stat__number">500+</span>
        <span class="stat__label">Events Streamed</span>
      </div>
      <div class="stat__divider"></div>
      <div class="stat">
        <span class="stat__number">4.9★</span>
        <span class="stat__label">Average Rating</span>
      </div>
      <div class="stat__divider"></div>
      <div class="stat">
        <span class="stat__number">99.9%</span>
        <span class="stat__label">Stream Uptime</span>
      </div>
    </div>
  </div>

  <!-- Slide indicators -->
  <!-- <div class="hero__dots">
    @for (video of videos; track video; let i = $index) {
      <button
        class="hero__dot"
        [class.hero__dot--active]="i === activeIndex"
        (click)="activeIndex = i"
        [attr.aria-label]="'Slide ' + (i + 1)">
      </button>
    }
  </div> -->

  <div class="hero__scroll-hint" (click)="scrollTo('how-it-works')">
    <span>Discover More</span>
    <div class="scroll-arrow"></div>
  </div>
</section>
