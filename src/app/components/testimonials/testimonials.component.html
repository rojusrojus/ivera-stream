<section id="testimonials" class="testi-section">

  <!-- Background video -->
  <video class="testi-section__video" autoplay muted loop playsinline preload="auto">
    <source src="https://assets.mixkit.co/videos/23095/23095-720.mp4" type="video/mp4">
  </video>
  <div class="testi-section__overlay"></div>

  <div class="container" style="position: relative; z-index: 2;">
    <div class="testi__header">
      <span class="section-label">Client Stories</span>
      <h2 class="section-title center" style="color: var(--color-white);">What Families Say</h2>
      <p class="section-subtitle" style="margin: 0 auto; text-align: center; color: rgba(255,255,255,0.65);">
        Real experiences from real families we've had the privilege of serving across the Lower Mainland.
      </p>
    </div>

    <div class="testi__grid">
      @for (t of testimonials; track t.name) {
        <div class="testi__card">
          <div class="testi__stars">
            @for (s of stars(t.stars); track $index) {
              <span class="star">★</span>
            }
          </div>
          <blockquote class="testi__quote">"{{ t.quote }}"</blockquote>
          <div class="testi__author">
            <div class="testi__avatar">{{ t.initials }}</div>
            <div>
              <div class="testi__name">{{ t.name }}</div>
              <div class="testi__role">{{ t.role }}</div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
